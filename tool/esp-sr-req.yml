# Generated by tools/gen_compile_req.py. Regenerate it whenever the models change:
#   python tools/gen_compile_req.py --for esp32p4 test_apps/esp-dl/models/wn10/model_p4_s16.espdl test_apps/esp-dl/models/wn10/model_p4_w8a16.espdl --for esp32s3 test_apps/esp-dl/models/wn10/model_s3_s16.espdl test_apps/esp-dl/models/wn10/model_s3_w8a16.espdl -o test_apps/esp-dl/models/wn10/model.compile_req.yml
#
# Registered from a component's CMakeLists.txt via esp_dl_compile_add_yml(). esp-dl then
# compiles only the ops listed below (see esp-dl/spec/ops.yml) and keeps only these Conv
# kernel symbols (see esp-dl/spec/kernels.yml and esp-dl/spec/select/Conv.yml).
#
# A model that needs an unlisted op cannot be instantiated by dl::Model; a Conv shape whose
# kernel is unlisted makes Conv log "no Conv kernel for packed key" and produce no output.
kernel_abi: 1

ops:
  - Add
  - AveragePool
  - Conv
  - GRU
  - LUT
  - LpNormalization
  - Mul
  - RMSNormalization
  - RequantizeLinear
  - Split
  - StreamingCache

kernels:
  # esp32p4
  - dl_esp32p4_s16_conv2d_per_channel_11cn
  - dl_esp32p4_s16_conv2d_per_channel_11cn_bias
  - dl_esp32p4_s16_depthwise_conv2d_per_channel_hwc1_bias
  - dl_esp32p4_s16_unaligned_conv2d_per_channel_11cn
  - dl_esp32p4_w8a16_conv2d_per_channel_11cn_bias
  # esp32s3
  - dl_tie728_s16_conv2d_11cn
  - dl_tie728_s16_conv2d_11cn_bias
  - dl_tie728_s16_depthwise_conv2d_hwc1_bias
  - dl_tie728_s16_unaligned_conv2d_11cn
  - dl_tie728_w8a16_conv2d_11cn_bias
