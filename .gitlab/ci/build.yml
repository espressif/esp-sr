.build_test_template:
  stage: build
  retry: 2
  tags:
    - build
  image: ${IMAGE}
  variables:
    BUILD_TARGET: "all"
    NINJA_JOBS: "4"
  artifacts:
    when: always
    paths:
      - "**/build*/*.bin"
      - "**/build*/*.map"
      - "**/build*/*.elf"
      - "**/build*/flasher_args.json"
      - "**/build*/flash_project_args"
      - "**/build*/config/sdkconfig.json"
      - "**/build*/bootloader/*.bin"
      - "**/build*/bootloader/*.elf"
      - "**/build*/partition_table/*.bin"
      - "**/build*/srmodels/*.bin"
    expire_in: 1 week
  script:
    - export REAL_NINJA="$(command -v ninja)"
    - chmod +x .gitlab/tool/ninja
    - export PATH="$CI_PROJECT_DIR/.gitlab/tool:$PATH"
    - python ./test_apps/build_apps.py $EXAMPLES_PATH -t $BUILD_TARGET

.build_esp_sr_template:
  extends:
    - .build_test_template
    - .rules:build:test_esp_sr
  parallel:
    matrix:
      - IMAGE:
          - espressif/idf:release-v5.4
          - espressif/idf:release-v5.5
          - espressif/idf:release-v6.0

.build_esp32s31_template:
  extends:
    - .build_test_template
    - .rules:build:test_esp_sr
  image: espressif/idf:release-v6.1
  variables:
    BUILD_TARGET: "esp32s31"

build_esp_sr_wakenet:
  extends: .build_esp_sr_template
